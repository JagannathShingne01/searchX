version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: searchx-postgres

    restart: always

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: searchx

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: searchx-redis

    restart: always

    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management

    container_name: searchx-rabbitmq

    restart: always

    ports:
      - "5672:5672"
      - "15672:15672"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0

    container_name: searchx-elasticsearch

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"

    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0

    container_name: searchx-kibana

    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

    depends_on:
      - elasticsearch

    ports:
      - "5601:5601"

volumes:
  postgres_data: